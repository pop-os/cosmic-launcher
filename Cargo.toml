[package]
name = "cosmic-launcher"
version = "1.11.0"
authors = ["Ashley Wulber <ashley@system76.com>"]
edition = "2024"
rust-version = "1.93"

[features]
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]
console = ["tokio/tracing"]

[profile.release]
lto = "thin"

[build-dependencies]
xdgen = "0.1.0"

[dependencies]
cosmic-launch.workspace = true
cosmic-launcher-config.workspace = true
console-subscriber.workspace = true
futures.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
log.workspace = true
libcosmic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-journald.workspace = true
tokio-stream.workspace = true
nix.workspace = true
pop-launcher.workspace = true
pop-launcher-service.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
zbus.workspace = true

[workspace]
members = ["cosmic-launcher-config"]

[workspace.dependencies]
cosmic-launch = { git = "https://github.com/pop-os/libcosmic/", features = [
    "systemd",
    "tokio",
] }
cosmic-config = { git = "https://github.com/pop-os/libcosmic/" }
cosmic-launcher-config = { path = "cosmic-launcher-config" }
console-subscriber = "0.5.0"
futures = "0.3.31"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
log = "0.4.29"
libcosmic = { git = "https://github.com/pop-os/libcosmic/", features = [
    "autosize",
    "dbus-config",
    "desktop",
    "winit",
    "multi-window",
    "wayland",
    "tokio",
    "single-instance",
    "xdg-portal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", default-features = false, features = [
    "std",
    "fmt",
    "env-filter",
] }
tracing-journald = "0.3.2"
tokio-stream = "0.1.18"
nix = { version = "0.31.1", features = ["process"] }
pop-launcher = { git = "https://github.com/pop-os/launcher/" }
pop-launcher-service = { git = "https://github.com/pop-os/launcher/" }
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["sync", "rt"] }
clap = { version = "4.5.56", features = ["derive"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio"] }

