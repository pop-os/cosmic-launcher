# cosmic-theme = { path = "../libcosmic/cosmic-theme" }

[patch."https://github.com/pop-os/launcher/"]
pop-launcher = { git = "https://github.com/avnyu/launcher/", branch = "config" }
pop-launcher-service = { git = "https://github.com/avnyu/launcher/", branch = "config" }
